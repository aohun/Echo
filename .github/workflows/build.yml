name: Build

# Pushing to master builds the macOS disk images and the Windows installer,
# so a broken build is known at once, and the packages are downloadable from
# the run.
#
# Nothing is committed back: the repository holds source, not the built
# app bundles and binaries (the hard rule in AGENTS.md about secrets and
# build output). The published packages live in this repository's GitHub
# Releases, which release.yml fills and the Homebrew cask points at.
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS disk images
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build the app and its disk images
        env:
          # the shell is the MyGo one: nogui leaves magpie's Wails window
          # out, echo puts the native UI in its place
          GOFLAGS: "-tags=nogui,echo"
        run: go tool mygo build -platform darwin/arm64,darwin/amd64

      - name: What was built
        run: ls -la build-echo

      - uses: actions/upload-artifact@v4
        with:
          name: echo-macos
          path: |
            build-echo/**/*.dmg
            build-echo/**/*.tar.gz
            build-echo/**/update-*.json
          if-no-files-found: error

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build the installer
        env:
          GOFLAGS: "-tags=nogui,echo"
        run: go tool mygo build -platform windows/amd64

      - name: What was built
        run: Get-ChildItem build-echo

      - uses: actions/upload-artifact@v4
        with:
          name: echo-windows
          path: |
            build-echo/**/*.exe
            build-echo/**/*.zip
            build-echo/**/*.tar.gz
            build-echo/**/update-*.json
          if-no-files-found: error
