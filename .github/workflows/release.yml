name: Release

# Pushing a v* tag builds the macOS disk images and the Windows installer,
# signs the update archives, and publishes them as this repository's own
# release: the app's updater reads them from here, and so does every
# download link (mygo.json's updates.github names this repository).
#
# The updater's private key is the repository's secret
# (MYGO_UPDATER_PRIVATE_KEY), never a file in the tree — the hard rule in
# AGENTS.md about secrets. Without it the build still makes the installers,
# only the signed update archives and their manifests are left out.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.0.1 — no v prefix; the v tag must exist)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      ref: ${{ steps.version.outputs.ref }}
    steps:
      - name: Get version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            REF="$GITHUB_REF_NAME"
            VERSION="${REF#v}"
          else
            VERSION="$INPUT_VERSION"
            REF="v$INPUT_VERSION"
          fi
          # a newline or quote would add outputs or break the JSON below
          [[ "$VERSION" =~ ^[0-9][0-9A-Za-z.+-]*$ ]] || { echo "bad version: $VERSION" >&2; exit 1; }
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "ref=$REF" >> $GITHUB_OUTPUT
          echo "Releasing $VERSION (ref: $REF)"

  macos:
    name: macOS disk images
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build the app and its disk images
        env:
          # the shell is the MyGo one: nogui leaves magpie's Wails window
          # out, echo puts the native UI in its place
          GOFLAGS: "-tags=nogui,echo"
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform darwin/arm64,darwin/amd64

      - name: What was built
        run: ls -la build-echo

      - uses: actions/upload-artifact@v4
        with:
          name: echo-macos
          path: |
            build-echo/**/*.dmg
            build-echo/**/*.tar.gz
            build-echo/**/update-*.json
          if-no-files-found: error

  windows:
    name: Windows installer
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build the installer
        env:
          GOFLAGS: "-tags=nogui,echo"
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform windows/amd64

      - name: What was built
        run: Get-ChildItem build-echo

      - uses: actions/upload-artifact@v4
        with:
          name: echo-windows
          path: |
            build-echo/**/*.exe
            build-echo/**/*.zip
            build-echo/**/*.tar.gz
            build-echo/**/update-*.json
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [version, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: packages

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.ref }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # the disk images, the installer, the signed update archives and
          # the manifests the updater reads
          find packages -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.zip' -o -name '*.tar.gz' -o -name 'update-*.json' \) \
            -exec cp {} dist/ \;
          ls -la dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            # not a draft: the updater reads the latest release's assets
            gh release create "$TAG" dist/* --verify-tag --title "Echo $TAG" --generate-notes
          fi
          gh release view "$TAG" --json assets -q '.assets | length'
