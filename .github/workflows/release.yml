name: Release

# Pushing a v* tag builds the macOS disk images and the Windows installer,
# signs the update archives, and publishes them as this repository's own
# release: the app's updater reads them from here, and so does every
# download link (mygo.json's updates.github names this repository).
#
# The updater's private key is the repository's secret
# (MYGO_UPDATER_PRIVATE_KEY), never a file in the tree — the hard rule in
# AGENTS.md about secrets. Without it the build still makes the installers,
# only the signed update archives and their manifests are left out.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.0.1 — no v prefix; the v tag must exist)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      ref: ${{ steps.version.outputs.ref }}
    steps:
      - name: Get version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            REF="$GITHUB_REF_NAME"
            VERSION="${REF#v}"
          else
            VERSION="$INPUT_VERSION"
            REF="v$INPUT_VERSION"
          fi
          # a newline or quote would add outputs or break the JSON below
          [[ "$VERSION" =~ ^[0-9][0-9A-Za-z.+-]*$ ]] || { echo "bad version: $VERSION" >&2; exit 1; }
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "ref=$REF" >> $GITHUB_OUTPUT
          echo "Releasing $VERSION (ref: $REF)"

  macos:
    name: macOS disk images
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build the app and its disk images
        env:
          # the shell is the MyGo one: nogui leaves magpie's Wails window
          # out, echo puts the native UI in its place
          GOFLAGS: "-tags=nogui,echo"
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform darwin/arm64,darwin/amd64

      - name: What was built
        run: ls -la build-echo

      - uses: actions/upload-artifact@v4
        with:
          name: echo-macos
          path: |
            build-echo/**/*.dmg
            build-echo/**/*.tar.gz
            build-echo/**/update-*.json
          if-no-files-found: error

  windows:
    name: Windows installer
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build the installer
        env:
          GOFLAGS: "-tags=nogui,echo"
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform windows/amd64

      - name: What was built
        run: Get-ChildItem build-echo

      - uses: actions/upload-artifact@v4
        with:
          name: echo-windows
          path: |
            build-echo/**/*.exe
            build-echo/**/*.zip
            build-echo/**/*.tar.gz
            build-echo/**/update-*.json
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [version, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: packages

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.ref }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # What people install: the two disk images — Apple silicon and
          # Intel — and the Windows installer. The raw binary and the app
          # bundle stay out of the page.
          for f in $(find packages -name '*.dmg'); do
            case "$f" in
              *arm64*) cp "$f" "dist/Echo-$VERSION-arm64.dmg" ;;
              *amd64*) cp "$f" "dist/Echo-$VERSION-x86_64.dmg" ;;
            esac
          done
          for f in $(find packages -name '*Setup*.exe'); do
            cp "$f" "dist/Echo-$VERSION-setup-amd64.exe"
          done

          # The in-app updater (the About page's 检查更新) reads a manifest
          # out of the latest release, and the manifest names a signed
          # archive to install. Those six files are what it needs, so they
          # are published with the three downloads: the page carries nine
          # assets, three of them what people install and six the updater's.
          for f in $(find packages -name '*.tar.gz' -o -name 'update-*.json'); do
            cp "$f" dist/
          done
          ls -la dist

          # the cask names the assets, so its version and hashes follow
          # what was built
          sed -i "s/version \"[^\"]*\"/version \"$VERSION\"/" Casks/echo.rb
          arm=$(sha256sum "dist/Echo-$VERSION-arm64.dmg" | cut -d' ' -f1)
          intel=$(sha256sum "dist/Echo-$VERSION-x86_64.dmg" | cut -d' ' -f1)
          sed -i "s/arm: \"[0-9a-f]*\"/arm: \"$arm\"/" Casks/echo.rb
          sed -i "s/intel: \"[0-9a-f]*\"/intel: \"$intel\"/" Casks/echo.rb
          git diff -- Casks/echo.rb || true

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            # not a draft: the updater reads the latest release's assets
            gh release create "$TAG" dist/* --verify-tag --title "Echo $TAG" --generate-notes
          fi
          gh release view "$TAG" --json assets -q '.assets | length'

      - name: Commit the cask
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/echo.rb
          if git diff --staged --quiet; then
            echo "the cask already names this version"
            exit 0
          fi
          git commit -m "release: Echo ${{ needs.version.outputs.version }}"
          git push origin HEAD:${{ github.ref_name }}
